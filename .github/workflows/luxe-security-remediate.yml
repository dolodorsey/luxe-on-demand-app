name: LUXE Security Remediation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/luxe-security-remediate.yml

permissions:
  contents: write

concurrency:
  group: luxe-security-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate dependency graph at current secure patch
        shell: bash
        run: |
          set -euo pipefail
          npm install next@16.3.4 eslint-config-next@16.3.4 --save-exact
          npm pkg set overrides.sharp=0.35.4
          npm pkg set overrides.nanoid=3.3.18
          npm pkg set overrides.baseline-browser-mapping=2.11.0
          npm install

      - name: Run full LUXE production verification
        run: npm run verify

      - name: Require no moderate-or-higher production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit verified dependency graph and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/luxe-security-remediate.yml
          git add package.json package-lock.json .github/workflows/luxe-security-remediate.yml
          if git diff --cached --quiet; then
            echo "No dependency changes produced; refusing to fabricate remediation."
            exit 1
          fi
          git commit -m "Upgrade LUXE production dependency security floor"
          git push origin HEAD:main
