name: LUXE Secret Namespace Remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/luxe-secret-namespace-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace cross-product secret resolver calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('supabase/functions/luxe-mobility-payments/index.ts'),
              Path('supabase/functions/luxe-mobility-connect-onboarding/index.ts'),
              Path('supabase/functions/luxe-mobility-stripe-webhook/index.ts'),
          ]
          old = "admin.rpc('sos_get_runtime_secret', { secret_name: name })"
          new = "admin.rpc('lm_get_runtime_secret', { p_key: name })"
          changed = 0
          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one S.O.S. resolver call, found {count}')
              path.write_text(text.replace(old, new))
              changed += count
          if changed != 3:
              raise SystemExit(f'Expected 3 resolver replacements, made {changed}')
          PY

          ! grep -R "sos_get_runtime_secret" \
            supabase/functions/luxe-mobility-payments \
            supabase/functions/luxe-mobility-connect-onboarding \
            supabase/functions/luxe-mobility-stripe-webhook
          grep -R "lm_get_runtime_secret" \
            supabase/functions/luxe-mobility-payments \
            supabase/functions/luxe-mobility-connect-onboarding \
            supabase/functions/luxe-mobility-stripe-webhook

      - name: Run LUXE production verification
        run: |
          npm ci
          npm run verify

      - name: Commit verified namespace isolation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/luxe-secret-namespace-remediate.yml
          git add \
            supabase/functions/luxe-mobility-payments/index.ts \
            supabase/functions/luxe-mobility-connect-onboarding/index.ts \
            supabase/functions/luxe-mobility-stripe-webhook/index.ts \
            .github/workflows/luxe-secret-namespace-remediate.yml
          git diff --cached --quiet && { echo 'No namespace remediation produced.'; exit 1; }
          git commit -m "Isolate LUXE runtime secrets from S.O.S. namespace"
          git push origin HEAD:main
